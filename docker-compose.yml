

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: immigrationsync-postgres
    environment:
      POSTGRES_DB: immigrationsync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123       # <-- You can change this database password!
    ports:
      - "5432:5432"
    volumes:
      # Mounts your existing init-scripts folder to auto-run the SQL file
      - ./init-scripts:/docker-entrypoint-initdb.d
      # Persists your data so it doesn't get wiped when the container stops
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: