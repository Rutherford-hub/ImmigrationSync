services:

  postgres:
    image: postgres:15-alpine
    container_name: ImmigraSync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: henry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/01_innit.sql:/docker-entrypoint-initdb.d/01_innit.sql
    networks:
      - ImmigraSync-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  discovery-service:
    build:
      context: ./services/discovery-service
      dockerfile: Dockerfile
    container_name: ImmigraSync-discovery
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      EUREKA_HOSTNAME: discovery-service
    networks:
      - ImmigraSync-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s



  user-service:
    build:
      context: ./services/User-service
      dockerfile: Dockerfile
    container_name: ImmigraSync-user
    restart: unless-stopped
    expose:
      - "8082"
    environment:
      DB_PASSWORD: henry
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ImmigraSync_users
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
    networks:
      - ImmigraSync-network

  application-service:
    build:
      context: ./services/application-service
      dockerfile: Dockerfile
    container_name: ImmigraSync-application
    restart: unless-stopped
    expose:
      - "8083"
    environment:
      DB_PASSWORD: henry
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ImmigraSync_applications
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
    networks:
      - ImmigraSync-network

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: ImmigraSync-notification
    restart: unless-stopped
    expose:
      - "8084"
    environment:
      DB_PASSWORD: henry
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ImmigraSync_notifications
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
    networks:
      - ImmigraSync-network

  document-service:
    build:
      context: ./services/document-service
      dockerfile: Dockerfile
    container_name: ImmigraSync-document
    restart: unless-stopped
    expose:
      - "8085"
    environment:
      DB_PASSWORD: henry
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ImmigraSync_documents
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      NOTIFICATION_SERVICE_URL: http://notification-service:8084/api/v1/notifications
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
    networks:
      - ImmigraSync-network

  gateway-service:
    build:
      context: ./services/gateway-service
      dockerfile: Dockerfile
    container_name: ImmigraSync-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
    depends_on:
      discovery-service:
        condition: service_started

      user-service:
        condition: service_started
      application-service:
        condition: service_started
      notification-service:
        condition: service_started
      document-service:
        condition: service_started
    networks:
      - ImmigraSync-network

networks:
  ImmigraSync-network:
    driver: bridge

volumes:
  postgres_data: