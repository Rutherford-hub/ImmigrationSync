server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # Route 1: User Service (Resolved dynamically via Eureka + Secured)
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/users/**, /api/v1/auth/**
          filters:
            - AuthenticationFilter

        # Route 2: Document Service (Resolved dynamically via Eureka + Secured)
        - id: document-service
          uri: lb://DOCUMENT-SERVICE
          predicates:
            - Path=/api/v1/documents/**
          filters:
            - AuthenticationFilter

        # Route 3: Notification Service (Resolved dynamically via Eureka + Secured)
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - AuthenticationFilter

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Logging Configuration
logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG