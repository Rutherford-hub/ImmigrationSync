server:
  port: 8084

spring:
  application:
    name: notification-service
  # We'll point it to the same DB. If you decide to make this service stateless 
  # later, you can easily remove the datasource block.
  datasource:
    url: jdbc:postgresql://localhost:5432/immigrationsync_notifications
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true