server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/immigrationsync
    username: postgres
    password: password123
    driver-class-name: org.postgresql.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true