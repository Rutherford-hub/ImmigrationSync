server:
  port: 8083
  servlet:
    context-path: /api/v1

spring:
  application:
    name: document-service
  datasource:
    url: jdbc:postgresql://localhost:5432/immigrationsync_documents
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# ADD THIS: Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG